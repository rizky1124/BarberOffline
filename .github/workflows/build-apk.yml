name: Build BarberOffline APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil proyek
        uses: actions/checkout@v6

      - name: Siapkan Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Ekstrak proyek
        run: |
          mkdir project
          unzip -q BarberOffline-Android-Project.zip -d project

      - name: Cari proyek Android
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        working-directory: project/BarberOffline
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: BarberOffline-APK
          path: project/BarberOffline/app/build/outputs/apk/debug/app-debug.apk
